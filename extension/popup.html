<!DOCTYPE html>
<html>
<head>
  <style>
    body { width: 540px; font-family: sans-serif; text-align: center; padding: 10px; background: #222; color: #fff; }
    .canvas-container { display: flex; justify-content: space-around; margin-top: 10px; }
    canvas { background: #000; border: 1px solid #444; max-width: 256px; }
    h3 { margin: 5px 0; }
  </style>
</head>
<body>
  <h3>Spectral Fingerprint Result</h3>
  <div class="canvas-container">
    <div>
      <div>Original (Grayscale)</div>
      <canvas id="originalCanvas" width="256" height="256"></canvas>
    </div>
    <div>
      <div>Magnitude Spectrum</div>
      <canvas id="spectrumCanvas" width="256" height="256"></canvas>
    </div>
  </div>

<script src="dsp.js"></script>
  <script src="popup.js"></script>
  <script src="fft.js"></script>
</body>
</html>
